name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      # nginx serves $WEB_ROOT (www-data can't read the home dir), so the
      # build is synced there; static files need no restart.
      # VITE_API_URL comes from $APP_DIR/.env and is baked in at build time.
      - name: Pull and build
        uses: appleboy/ssh-action@v1
        env:
          APP_DIR: /home/dafinmaulana/snapcatch
          WEB_ROOT: /var/www/snapcatch
          NODE_BIN: /home/dafinmaulana/.nvm/versions/node/v24.21.0/bin
          COMMIT: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_DIR,WEB_ROOT,NODE_BIN,COMMIT
          command_timeout: 10m
          script: |
            set -euo pipefail
            export PATH="$NODE_BIN:$PATH"

            cd "$APP_DIR"

            echo "::group::Checkout $COMMIT"
            git checkout main
            git fetch --prune origin main
            git merge --ff-only "$COMMIT"
            echo "::endgroup::"

            echo "::group::Install dependencies"
            npm ci
            echo "::endgroup::"

            echo "::group::Build"
            npm run build
            echo "::endgroup::"

            echo "::group::Publish to $WEB_ROOT"
            rsync -a --delete dist/ "$WEB_ROOT/"
            echo "::endgroup::"
